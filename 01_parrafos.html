<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Párrafos y Encabezados </title>
</head>
<body>
<!-- Titulos o Encabezados
se tienen 6 tipos de encabezados, desde el h1 hasta el h6.-->
<!-- (h$*6) Crea 6 titulos en orden del 1 al 6 Emmet-->
<h1>Titulo</h1>
<!-- El h1 se utiliza una sola vez por pagina web esto debido a que el h1 tiene importancia en el CEO lo que es el posicionamiento WEB, es decir, google le da mucha importancia al h1-->
<h2>Subtitulo</h2>
<h3>Subtitulo</h3>
<h4>Subtitulo</h4>
<h5>Subtitulo</h5>
<h6>Subtitulo</h6>
<!-- Desde el h2 hasta el h6, se pueden utilizar las veces que sean necesarias según el contenido que se queria recrear. -->

<!-- Párrafo: Los párrafos deben tener una idea o punto especifico.
Cada parrafo escrito debe de contener un concepto, una idea. Es decir, puede escribir una sección o un elemento, hasta que un mensaje en el chat. Por ejemplo en una seccion se habla sobre los beneficios del ejercicio: 
Un párrafo puede tratar de mejorar la salud cardiovascular y otro puede ser sobre los beneficios y cuidados de la salud mental. Finalmente, debe existir un motivo para que exista un párrafo. -->
<p>
    Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quibusdam delectus nobis consequatur quam libero vel sunt corporis voluptates id! Quod vero voluptate fugit dolore deserunt cupiditate beatae nihil inventore dolorem.
</p>
<!-- (CTRL+SHITF+P) o (ATL+Z) Ajusta el contenido del párrafo a la ventana del editor -->
<!-- Existen algunas tecnologias de asistencia como lectores de pantalla, que ayudan a las personas con discapacidad visual a navegar por el contenido web -->
</body>
</html>
